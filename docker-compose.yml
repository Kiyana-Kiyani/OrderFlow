name: orderflow

services:
  orderflow.api:
    container_name: api 
    image: ${DOCKER_REGISTRY-}orderflowapi 
    build:
      context: .
      dockerfile: Src/OrderFlow.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Development   
      # DB
      ConnectionStrings__Default: Server=sqlserver;Database=OrderFlowDB;User Id=sa;Password=${PASSWORD};TrustServerCertificate=True;
      # RabbitMQ 
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      # Jwt
      Jwt__Audience: ${JwtAudience}
      Jwt__Issuer: ${JwtIssuer}
      Jwt__SecretKey: ${JwtSecretKey}
      Jwt__ExpirationMinutes: ${JwtExpirationMinutes}

    ports:
       - "5000:8080"

    depends_on: 
       sqlserver:
        condition: service_healthy
       rabbitmq:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 2s
      retries: 2

  sqlserver:
    container_name: sqlserver  
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${PASSWORD}
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${PASSWORD}","-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - sql_data:/var/opt/mssql

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    ports:
      - "5672:5672"    # AMQP (your app uses this)
      - "15672:15672"  # Management UI (browser)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
     - rabbitmq_data:/var/lib/rabbitmq
 

volumes:
  sql_data:
  rabbitmq_data: