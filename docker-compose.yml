name: orderflow

services:


  orderflow.api:
    container_name: api 
    image: ${DOCKER_REGISTRY-}orderflowapi 
    build:
      context: .
      dockerfile: Src/OrderFlow.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Development   
      # DB
      ConnectionStrings__Default: Server=sqlserver;Database=OrderFlowDB;User Id=sa;Password=${PASSWORD};TrustServerCertificate=True;
      # RabbitMQ
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RabbitMQ_Username}
      RabbitMQ__Password: ${RabbitMQ_Password}
      # Jwt
      Jwt__Audience: ${JwtAudience}
      Jwt__Issuer: ${JwtIssuer}
      Jwt__SecretKey: ${JwtSecretKey}
      Jwt__ExpirationMinutes: ${JwtExpirationMinutes}
      Jwt__RefreshTokenExpirationDays: ${JwtRefreshTokenExpirationDays}
      # Seq
      Seq__Url: http://seq:5341

    ports:
       - "5000:8080"

    depends_on: 
       sqlserver:
        condition: service_healthy
       rabbitmq:
        condition: service_healthy
       seq:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 2s
      retries: 2




  sqlserver:
    container_name: sqlserver  
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${PASSWORD}
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${PASSWORD}","-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - sql_data:/var/opt/mssql



  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    ports:
      - "5672:5672"    # AMQP (your app uses this)
      - "15672:15672"  # Management UI (browser)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
     - rabbitmq_data:/var/lib/rabbitmq
    


  seq:
    container_name: seq_logger
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: true
    volumes:
      - seq_data:/data
    ports:
      - "5341:80" 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 15s
   

    

  redis:
    container_name: orderflow_redis
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always


  orderflow.workers.payment:
    image: ${DOCKER_REGISTRY-}orderflowworkerspayment
    build:
      context: .
      dockerfile: Src/OrderFlow.Workers.Payment/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      # RabbitMQ
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: ${RabbitMQ_Username}
      RabbitMQ__Password: ${RabbitMQ_Password}
      # Seq
      Seq__Url: http://seq:5341
    depends_on: 
       rabbitmq:
        condition: service_healthy
       seq:
        condition: service_healthy



  courier-worker:
    container_name: orderflow_courier_worker
    image: orderflow-courierworker:latest
    build:
      context: .
      dockerfile: OrderFlow.Worker.Courier/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy # Wait until diagnostics ping succeeds
      seq:
        condition: service_healthy # Wait until web health check returns HTTP 200
      redis:
        condition: service_healthy # Wait until redis-cli ping succeeds
    environment:
      DOTNET_ENVIRONMENT: Development
      # RabbitMQ
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: ${RabbitMQ_Username}
      RabbitMQ__Password: ${RabbitMQ_Password}
      # Seq
      Seq__Url: http://seq:5341
      #Redis
      Redis__ConnectionString: orderflow_redis:6379
    restart: on-failure

volumes:
  sql_data:
  rabbitmq_data:
  seq_data:
